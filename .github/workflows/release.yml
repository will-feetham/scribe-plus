# On every push to main: run all the tests, and if the version in
# scribe_plus/__init__.py has no release yet, build and publish one.
# The download page always points at the newest release.
#
# The beta branch works the same way for test builds: a version such as
# 1.1.0b1 is published as a GitHub pre-release with its own install line.
# Pre-releases are never "latest", so the download page and the normal
# install line stay on the last full release. main never publishes a test
# version, and beta never publishes a full one.
name: Release

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      needed: ${{ steps.v.outputs.needed }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' scribe_plus/__init__.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *a[0-9]*|*b[0-9]*|*rc[0-9]*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          needed=true
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            needed=false
            echo "v$version is already released; tests only."
          elif [ "$GITHUB_REF_NAME" = main ] && [ "$prerelease" = true ]; then
            needed=false
            echo "$version is a test version; main only publishes full releases. Tests only."
          elif [ "$GITHUB_REF_NAME" != main ] && [ "$prerelease" = false ]; then
            needed=false
            echo "$version is a full version; only main publishes those. Tests only."
          else
            echo "Will release v$version (pre-release: $prerelease)."
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

  tests:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [check, tests]
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mac-release
      - name: Windows zip
        run: git archive --format=zip --prefix=ScribePlus/ -o ScribePlus-Windows.zip HEAD
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          flags=(--target "$GITHUB_SHA")
          title="Scribe Plus $VERSION"
          notes="Install or update: https://scribeplus.feetham.us"
          if [ "$PRERELEASE" = true ]; then
            # This build's Mac installer installs this build, not the latest release.
            sed -i "s/^RELEASE_TAG=\"\"/RELEASE_TAG=\"v$VERSION\"/" install-mac.sh
            grep -q "^RELEASE_TAG=\"v$VERSION\"" install-mac.sh
            flags+=(--prerelease)
            title="Scribe Plus $VERSION (test build)"
            notes="Test build, not on the download page. Mac install line (with call transcripts):

              curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/install-mac.sh | bash -s -- --calls"
          fi
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --generate-notes \
            --notes "$notes" \
            "${flags[@]}" \
            ScribePlus-Windows.zip ScribePlus-mac.tar.gz install-mac.sh install-windows.ps1
